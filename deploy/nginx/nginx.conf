# Edge proxy for the PMS. Server blocks live in templates/pms.conf.template,
# which the nginx image renders into conf.d/ at start-up.

user  nginx;
worker_processes  auto;
worker_rlimit_nofile  65535;

error_log  /dev/stderr  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  8192;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    charset       utf-8;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65s;
    keepalive_requests 1000;
    reset_timedout_connection on;

    # Slow-client protection.
    client_header_timeout 15s;
    client_body_timeout   30s;
    send_timeout          30s;
    large_client_header_buffers 4 16k;

    # ------------------------------------------------------------ logging
    # $uri, never $request or $args: the queue socket authenticates with
    # ?access_token=<JWT>, and a log line is no place for a bearer token.
    # $host is in every line because the subdomain *is* the tenant.
    log_format json escape=json
      '{'
        '"time":"$time_iso8601",'
        '"request_id":"$pms_request_id",'
        '"remote_addr":"$remote_addr",'
        '"host":"$host",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"protocol":"$server_protocol",'
        '"status":$status,'
        '"bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_time":"$upstream_response_time",'
        '"user_agent":"$http_user_agent",'
        '"referer":"$http_referer"'
      '}';
    access_log /dev/stdout json;

    # ---------------------------------------------------------- client IP
    # nginx is the edge by default and $remote_addr is the client. If a cloud
    # load balancer or CDN sits in front, uncomment and list ITS ranges only —
    # trusting anything wider lets a client choose its own rate-limit bucket.
    # real_ip_header    X-Forwarded-For;
    # real_ip_recursive on;
    # set_real_ip_from  10.0.0.0/8;

    # ------------------------------------------------------- request ids
    # Keep a caller's X-Request-ID when it looks like one (the web app may send
    # its own for correlation), otherwise mint one. Either way the API, the
    # logs and the response all carry the same id.
    map $http_x_request_id $pms_request_id {
        default                          $request_id;
        "~^[A-Za-z0-9._-]{8,64}$"        $http_x_request_id;
    }

    # ---------------------------------------------------------- websockets
    map $http_upgrade $connection_upgrade {
        default  upgrade;
        ""       "";
    }

    # ------------------------------------------------------- rate limiting
    # The API limits per process (600/min/IP) and per account on sign-in; these
    # are the shared flood guard in front of it, set well above the API's own
    # numbers so they bite only on abuse. A whole clinic often shares one NAT
    # address — keep that in mind before tightening.
    limit_req_zone  $binary_remote_addr zone=rl_api:20m  rate=20r/s;
    limit_req_zone  $binary_remote_addr zone=rl_auth:10m rate=60r/m;
    limit_conn_zone $binary_remote_addr zone=rl_conn:10m;
    limit_req_status  429;
    limit_conn_status 429;

    # ---------------------------------------------------------------- gzip
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types
        application/json
        application/javascript
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # ----------------------------------------------------------------- TLS
    # Mozilla "intermediate". No OCSP stapling: Let's Encrypt retired its
    # OCSP responders in 2025 and stapling against them only logs warnings.
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:20m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # The rendered template only — not conf.d/*.conf, which would also pick up
    # the image's stock default.conf and its welcome page.
    include /etc/nginx/conf.d/pms.conf;
}
