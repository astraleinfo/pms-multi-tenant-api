# Local development.
#
# One network, and almost nothing on it is published. Postgres and Redis are
# bound to 127.0.0.1 so the host's own tools and the `make run` flow can still
# reach them without the ports being offered to the network the machine is on;
# Flower is not published at all.
#
#   api ──> redis <── worker ──> postgres
#    │        ▲         ▲
#    │        └─ flower ┘          (events in, history in memory)
#    └────────> flower              /v1/platform/jobs/*, super admin only
#
# Flower answers on 5555 inside `pms-internal` and nowhere else. The only way
# to it from outside is through the API, which asks who is calling first — see
# `app/api/v1/jobs.py`.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    # Published on 55432 so it does not collide with a PostgreSQL already
    # running on the host, and on the loopback only so it is not on the LAN.
    ports:
      - "127.0.0.1:55432:5432"
    networks: [pms-internal]
    volumes:
      - pms-data:/var/lib/postgresql/data
      - ./scripts/bootstrap_db.sql:/docker-entrypoint-initdb.d/10-bootstrap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The message outbox and the Celery broker. Published on 6380 so it does not
  # collide with a Redis already running on the host for something else — and
  # on the loopback only: the broker carries every queued job.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"
    networks: [pms-internal]
    volumes:
      - pms-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://pms_app:app-password-change-me@db:5432/pms
      MIGRATION_DATABASE_URL: postgresql+asyncpg://pms_owner:owner-password-change-me@db:5432/pms
      JWT_SECRET: dev-secret-only-for-local-development-not-a-real-secret
      APP_DOMAIN: localhost
      COOKIE_SECURE: "false"
      # The web app runs on *.localhost:3000 and reaches the API through a
      # proxy that rewrites Host, so the slug arrives in a header instead.
      ALLOW_TENANT_HEADER: "true"
      REDIS_URL: redis://redis:6379/0
      # Where the jobs section reads from. The service name resolves inside
      # `pms-internal` and nowhere else.
      FLOWER_URL: http://flower:5555
      FLOWER_BASIC_AUTH: ${FLOWER_BASIC_AUTH:-pms-console:dev-only-flower-password}
      # The web app serves this API under /api, so that is the path Flower's
      # own links have to be built from. Both containers are told the same one.
      FLOWER_URL_PREFIX: api/v1/platform/jobs/flower
    ports:
      - "8000:8000"
    networks: [pms-internal]
    command: >
      sh -c "alembic upgrade head && python scripts/seed.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./app:/srv/app:ro
      - ./alembic:/srv/alembic:ro

  # Celery. `stop_grace_period` lets a warm shutdown finish the job in hand
  # before the container is killed; anything cut off anyway was never acked
  # and goes back on the queue.
  worker:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: &worker-env
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://pms_app:app-password-change-me@db:5432/pms
      JWT_SECRET: dev-secret-only-for-local-development-not-a-real-secret
      APP_DOMAIN: localhost
      REDIS_URL: redis://redis:6379/0
    networks: [pms-internal]
    # `-E` publishes the task events Flower reads. It is also set in the Celery
    # configuration, so a worker started without the flag still reports.
    command: celery -A app.worker.celery_app worker -Q pms --loglevel=INFO -E
    stop_grace_period: 60s
    restart: unless-stopped
    healthcheck:
      disable: true

  # Exactly one of these, ever: it schedules the sweep.
  beat:
    build: .
    depends_on:
      redis:
        condition: service_healthy
    environment: *worker-env
    networks: [pms-internal]
    command: celery -A app.worker.celery_app beat --loglevel=INFO --schedule /tmp/celerybeat-schedule
    restart: unless-stopped
    healthcheck:
      disable: true

  # The job monitor.
  #
  # No `ports:` — deliberately, and it is the whole security story of this
  # feature. 5555 is reachable from `api` and from nothing else, and the API
  # will not relay a byte of it to anyone who is not a super admin.
  #
  # `--basic_auth` is the second lock: a private network is not a credential,
  # and without it anything that ever lands on this network has every job's
  # arguments. `--url_prefix` has to match FLOWER_URL_PREFIX on the API, because
  # Flower builds its own links from it and those links are followed by a
  # browser that only ever sees the proxy.
  flower:
    build: .
    depends_on:
      redis:
        condition: service_healthy
    environment: *worker-env
    networks: [pms-internal]
    expose:
      - "5555"
    command: >
      celery -A app.worker.celery_app flower
        --address=0.0.0.0
        --port=5555
        --url_prefix=api/v1/platform/jobs/flower
        --basic_auth=${FLOWER_BASIC_AUTH:-pms-console:dev-only-flower-password}
        --persistent=True
        --db=/tmp/flower.db
        --max_tasks=10000
    restart: unless-stopped
    healthcheck:
      disable: true

networks:
  pms-internal:
    driver: bridge

volumes:
  pms-data:
  pms-redis:
