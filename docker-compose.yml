# docker compose up -d --build
#
# .env needs: POSTGRES_PASSWORD, PMS_OWNER_PASSWORD, PMS_APP_PASSWORD,
# FLOWER_BASIC_AUTH (user:password), plus the app settings.

x-app: &app
  build: .
  image: pms-api:latest
  env_file: .env
  restart: unless-stopped
  environment: &app-env
    DATABASE_URL: postgresql+asyncpg://pms_app:${PMS_APP_PASSWORD}@db:5432/pms
    REDIS_URL: redis://redis:6379/0
    FLOWER_URL: http://flower:5555
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PMS_OWNER_PASSWORD: ${PMS_OWNER_PASSWORD}
      PMS_APP_PASSWORD: ${PMS_APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/bootstrap_db.sql:/bootstrap/bootstrap_db.sql:ro
      - ./deploy/db/10-bootstrap.sh:/docker-entrypoint-initdb.d/10-bootstrap.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d pms"]
      interval: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 10

  migrate:
    <<: *app
    restart: "no"
    environment:
      <<: *app-env
      MIGRATION_DATABASE_URL: postgresql+asyncpg://pms_owner:${PMS_OWNER_PASSWORD}@db:5432/pms
    command: ["alembic", "upgrade", "head"]

  api:
    <<: *app
    ports:
      - "0.0.0.0:${PMS_API_PORT:-18000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *app
    command: ["celery", "-A", "app.worker.celery_app", "worker", "-Q", "pms", "--loglevel=INFO", "-E"]

  beat:
    <<: *app
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=INFO", "--schedule", "/tmp/celerybeat-schedule"]

  flower:
    <<: *app
    command:
      - celery
      - -A
      - app.worker.celery_app
      - flower
      - --port=5555
      - --url_prefix=api/v1/platform/jobs/flower
      - --basic_auth=${FLOWER_BASIC_AUTH}

volumes:
  pgdata:
  redisdata:
