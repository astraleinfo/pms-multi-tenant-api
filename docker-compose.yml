# Local development. Postgres is published on 55432 so it does not collide with
# a PostgreSQL already running on the host.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "55432:5432"
    volumes:
      - pms-data:/var/lib/postgresql/data
      - ./scripts/bootstrap_db.sql:/docker-entrypoint-initdb.d/10-bootstrap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://pms_app:app-password-change-me@db:5432/pms
      MIGRATION_DATABASE_URL: postgresql+asyncpg://pms_owner:owner-password-change-me@db:5432/pms
      JWT_SECRET: dev-secret-only-for-local-development-not-a-real-secret
      APP_DOMAIN: localhost
      COOKIE_SECURE: "false"
      # The web app runs on *.localhost:3000 and reaches the API through a
      # proxy that rewrites Host, so the slug arrives in a header instead.
      ALLOW_TENANT_HEADER: "true"
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head && python scripts/seed.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./app:/srv/app:ro
      - ./alembic:/srv/alembic:ro

volumes:
  pms-data:
