# Server deployment, beside other applications behind the host's own nginx.
#
#   docker compose up -d --build
#
# Once, after the first `up`: the catalogues and the console's first super
# admin, with no demo data. It asks for the password (12 characters or more).
#
#   docker compose run --rm migrate python scripts/seed.py --production \
#       --email you@example.com --name "Your Name"
#
# Local development is docker-compose.dev.yml (`make db`, `make redis`).
#
# Everything comes from .env: the app's settings (see .env.example, with
# ENVIRONMENT=production) plus four values Compose reads itself:
#
#   POSTGRES_PASSWORD    the database superuser; the db container only
#   PMS_OWNER_PASSWORD   pms_owner, which owns the schema; the migrate job only
#   PMS_APP_PASSWORD     pms_app, which the API and the workers connect as
#   FLOWER_BASIC_AUTH    user:password for the job monitor
#
# Use hex (openssl rand -hex 24) for the passwords: they go into URLs as-is.
# The database URLs are built here from them, so .env needs neither
# DATABASE_URL nor MIGRATION_DATABASE_URL, and whatever it says for those is
# overridden. The three database passwords are blanked inside every app
# container — .env reaches them whole, but the owner credential belongs to the
# migrate job alone (README, "The database").
#
# Published: the API on 127.0.0.1:PMS_API_PORT (default 18000), for the host
# nginx (deploy/host-nginx/pms.conf.template), and nothing else. Set
# PMS_API_PORT in .env when something on the server already listens on 18000.
# PostgreSQL, Redis and Flower answer on `pms-internal` only. The ports inside
# the containers (8000, 5432, 6379, 5555) are each container's own and cannot
# collide with another stack's; only a published host port can.

# Volumes, all prefixed with the project name (pms-multi-tenant-api_…):
#   pms-pgdata   the database          pms-redis   the broker's append-only file
#   pms-flower   Flower's task history, so a restart keeps it
#
#        host nginx ──127.0.0.1:PMS_API_PORT──> api ──> db
#                                         │
#                                         └──> redis <── worker, beat, flower

x-app: &app
  image: pms-api:latest
  build:
    context: .
    args:
      # Error reports name the build they came from:
      #   APP_RELEASE=$(git rev-parse --short HEAD) docker compose build
      APP_RELEASE: ${APP_RELEASE:-}
  env_file: .env
  networks: [pms-internal]
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  restart: unless-stopped
  logging: &logging
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://pms_app:${PMS_APP_PASSWORD:?set PMS_APP_PASSWORD in .env}@db:5432/pms
  REDIS_URL: redis://redis:6379/0
  FLOWER_URL: http://flower:5555
  MIGRATION_DATABASE_URL: ""
  POSTGRES_PASSWORD: ""
  PMS_OWNER_PASSWORD: ""
  PMS_APP_PASSWORD: ""

services:
  db:
    image: postgres:16-alpine
    # Not env_file: the database needs its three passwords and none of the
    # app's settings.
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PMS_OWNER_PASSWORD: ${PMS_OWNER_PASSWORD:?set PMS_OWNER_PASSWORD in .env}
      PMS_APP_PASSWORD: ${PMS_APP_PASSWORD:?set PMS_APP_PASSWORD in .env}
    networks: [pms-internal]
    volumes:
      - pms-pgdata:/var/lib/postgresql/data
      # Both run on the volume's first start only; changing a password in
      # .env later does not change it in the database.
      - ./scripts/bootstrap_db.sql:/bootstrap/bootstrap_db.sql:ro
      - ./deploy/db/10-bootstrap.sh:/docker-entrypoint-initdb.d/10-bootstrap.sh:ro
    # Over TCP, on purpose: during first-time initialisation the server listens
    # on its socket only, so this stays unhealthy until the roles exist.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d pms"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    stop_grace_period: 60s
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    networks: [pms-internal]
    volumes:
      - pms-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *logging

  # Runs to completion before the API starts, on every `up`. The only
  # container that holds the owner credential.
  migrate:
    <<: *app
    environment:
      <<: *app-env
      MIGRATION_DATABASE_URL: postgresql+asyncpg://pms_owner:${PMS_OWNER_PASSWORD:?set PMS_OWNER_PASSWORD in .env}@db:5432/pms
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    healthcheck:
      disable: true

  api:
    <<: *app
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PMS_API_PORT:-18000}:8000"
    # One replica: see the CMD in the Dockerfile.
    stop_grace_period: 40s

  # The worker, beat and Flower share the API's image, whose HEALTHCHECK probes
  # port 8000. Only the API listens there, so each of them turns it off rather
  # than reporting unhealthy forever.
  worker:
    <<: *app
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "app.worker.celery_app", "worker", "-Q", "pms", "--loglevel=INFO", "-E"]
    stop_grace_period: 60s
    healthcheck:
      disable: true

  # Exactly one, ever: it schedules the sweep.
  beat:
    <<: *app
    environment: *app-env
    depends_on:
      redis:
        condition: service_healthy
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=INFO", "--schedule", "/tmp/celerybeat-schedule"]
    healthcheck:
      disable: true

  # Not published. Reachable only from the API, which checks for a super admin
  # before relaying a byte (app/api/v1/jobs.py).
  flower:
    <<: *app
    environment: *app-env
    depends_on:
      redis:
        condition: service_healthy
    expose: ["5555"]
    volumes:
      - pms-flower:/var/lib/flower
    command:
      - celery
      - -A
      - app.worker.celery_app
      - flower
      - --address=0.0.0.0
      - --port=5555
      - --url_prefix=api/v1/platform/jobs/flower
      - --basic_auth=${FLOWER_BASIC_AUTH:?set FLOWER_BASIC_AUTH in .env, user:password}
      - --persistent=True
      - --db=/var/lib/flower/flower.db
      - --max_tasks=10000
    healthcheck:
      disable: true

networks:
  pms-internal:
    driver: bridge

volumes:
  pms-pgdata:
  pms-redis:
  pms-flower:
