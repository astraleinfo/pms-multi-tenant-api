# Production.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# .env.production  the app's settings (see .env.example) with ENVIRONMENT=production,
#                  plus APP_DOMAIN and FLOWER_BASIC_AUTH, which this file also reads.
# .env.migrate     MIGRATION_DATABASE_URL only.
#
# Differences from docker-compose.dev.yml, all deliberate:
#   * nginx is the only thing with a published port. The API is on the internal
#     network, so FORWARDED_ALLOW_IPS="*" in the image trusts nginx and nothing else.
#   * Migrations are a one-shot job holding the owner credential; the API never
#     sees MIGRATION_DATABASE_URL (README, "The database").
#   * No seed, no --reload, no source mounts. Root filesystems are read-only.
#   * PostgreSQL is not here: point DATABASE_URL at a managed instance, or add a
#     `db` service on `pms-internal` with a volume and backups of its own.
#
#        internet ──443──> nginx ──> api ──> postgres (external)
#                            │        │
#                            └> web   └──> redis <── worker, beat, flower

x-app: &app
  image: ${PMS_IMAGE:-pms-api:latest}
  build:
    context: .
    args:
      # Error reports name the build they came from:
      #   APP_RELEASE=$(git rev-parse --short HEAD) docker compose -f docker-compose.prod.yml build
      APP_RELEASE: ${APP_RELEASE:-}
  env_file: .env.production
  networks: [pms-internal]
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  restart: unless-stopped
  logging: &logging
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  nginx:
    image: nginx:1.28-alpine
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN, e.g. astrale.health}
      API_UPSTREAM: api:8000
      WEB_UPSTREAM: ${WEB_UPSTREAM:-web:3000}
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: "1"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/templates:/etc/nginx/templates:ro
      # fullchain.pem + privkey.pem for APP_DOMAIN and *.APP_DOMAIN.
      - ${TLS_CERT_DIR:-./deploy/certs}:/etc/nginx/certs:ro
    networks: [pms-internal]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    networks: [pms-internal]
    volumes:
      - pms-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *logging

  # Runs to completion before the API starts, on every deploy. The only
  # container that holds the owner credential.
  migrate:
    <<: *app
    # .env.migrate holds MIGRATION_DATABASE_URL and nothing else. It is a
    # separate file so that .env.production — which every other service loads —
    # never contains the owner credential.
    env_file: [.env.production, .env.migrate]
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    healthcheck:
      disable: true

  api:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # One replica: see the CMD in the Dockerfile.
    stop_grace_period: 40s

  worker:
    <<: *app
    depends_on:
      redis:
        condition: service_healthy
    command: ["celery", "-A", "app.worker.celery_app", "worker", "-Q", "pms", "--loglevel=INFO", "-E"]
    stop_grace_period: 60s
    healthcheck:
      disable: true

  # Exactly one, ever: it schedules the billing cycle (RENT_BILLING_ENABLED).
  beat:
    <<: *app
    depends_on:
      redis:
        condition: service_healthy
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=INFO", "--schedule", "/tmp/celerybeat-schedule"]
    healthcheck:
      disable: true

  # Not published. Reachable only from the API, which checks for a super admin
  # before relaying a byte (app/api/v1/jobs.py).
  flower:
    <<: *app
    depends_on:
      redis:
        condition: service_healthy
    expose: ["5555"]
    command:
      - celery
      - -A
      - app.worker.celery_app
      - flower
      - --address=0.0.0.0
      - --port=5555
      - --url_prefix=api/v1/platform/jobs/flower
      - --basic_auth=${FLOWER_BASIC_AUTH:?set FLOWER_BASIC_AUTH, user:password}
      - --persistent=True
      - --db=/tmp/flower.db
      - --max_tasks=10000
    healthcheck:
      disable: true

networks:
  pms-internal:
    driver: bridge

volumes:
  pms-redis:
