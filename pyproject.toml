[project]
name = "pms-multi-tenant-api"
version = "1.0.0"
description = "Multi-tenant patient management API — FastAPI + PostgreSQL with row-level tenant isolation"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "reportlab>=4.0",
    # multipart form parsing, for the files a lab order collects
    "python-multipart>=0.0.9",
    # Fernet, for the provider credentials a clinic stores against its own row
    "cryptography>=42.0",
    # the outbound HTTP client the SMS provider talks over. A runtime import,
    # not a test one — the tests happen to use it too, which is what hid the
    # `cryptography` gap: a dev-only httpx made this list look complete.
    "httpx>=0.27",
    # `zoneinfo` reads the operating system's tz database. Linux and macOS ship
    # one; Windows does not, so every clinic timezone lookup raises there unless
    # this is installed. Free on the platforms that do not need it.
    "tzdata>=2024.1; platform_system == 'Windows'",
    # Background jobs — support-request emails. A dependency, not an extra:
    # the API enqueues on the support route. `[redis]` brings the broker client.
    "celery[redis]>=5.4",
    # S3 file storage and SES email. Imported only when STORAGE_BACKEND=s3 or
    # MAIL_PROVIDER=ses, but a dependency rather than an extra so switching a
    # deployment over is a configuration change, not a rebuild.
    "boto3>=1.34",
    # Reading and writing the onboarding spreadsheets.
    "openpyxl>=3.1",
    # Error reporting to Sentry. Imported only when ERROR_REPORTER=sentry, and a
    # dependency for the same reason as boto3: turning it on is configuration.
    "sentry-sdk>=2.0",
    # UUIDv7 primary keys (`app/db/base.py`). The standard library has
    # `uuid.uuid7` only from Python 3.14; `compat` returns stdlib `uuid.UUID`s.
    "uuid-utils>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    # A fake AWS for the S3 and SES tests — nothing leaves the machine.
    "moto[s3,ses]>=5.0",
    # Reads the text back out of the PDFs the API renders.
    "pypdf>=4.0",
]
# The Celery monitor. Not imported by this application at all — the API reads
# it over HTTP like any other service — so it is an extra rather than a
# dependency. The container image installs it because one image runs the API,
# the worker, beat and Flower; a deployment that runs no monitor can leave it
# out and set FLOWER_ENABLED=false.
monitor = ["flower>=2.0"]
# The outbox nudge, and only the nudge. `app/services/messaging/outbox.py`
# imports this inside the call and swallows its absence on purpose — without it
# a queued message waits for the sweep instead of going out immediately, which
# is why it is an extra rather than a dependency.
redis = ["redis>=5.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["B008", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "E501"]
"app/seed/*" = ["S105", "S106"]
# Generated by autogenerate, and the RLS migration builds its statements from a
# fixed list of table names — no request data reaches either one.
"alembic/versions/*" = ["E501", "S608"]
# HTML email templates. Every style has to be inline (a <style> block is
# stripped by most clients), so the markup is wide by construction — wrapping
# it at 110 columns would break the strings, not tidy them.
"app/services/mailer.py" = ["E501"]
