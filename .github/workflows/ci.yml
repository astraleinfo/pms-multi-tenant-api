name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create roles and databases
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f scripts/bootstrap_db.sql

      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://pms_app:app-password-change-me@localhost:5432/pms_test
          TEST_MIGRATION_DATABASE_URL: postgresql+asyncpg://pms_owner:owner-password-change-me@localhost:5432/pms_test
